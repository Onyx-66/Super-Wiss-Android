name: Import verified v1.3.1 source
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-v131-source.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: super-wiss-source-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out existing history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Download and verify the authorized source snapshot
        env:
          SOURCE_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-014c-8210-8668-c228feab6d63/raw?se=2026-09-27T02%3A57%3A02Z&sp=r&sv=2026-02-06&sr=b&scid=1b2dc702-50dc-5f5d-94d6-866cc88a083b&skoid=a3a8eefe-d4bd-4909-ab1d-2a75a2302fac&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-27T02%3A37%3A09Z&ske=2026-09-28T02%3A37%3A09Z&sks=b&skv=2026-02-06&sig=Q9fNgNwOYaWjJfsu7MI7z9EeQMMOfkJhjTN2fjTS/S0%3D'
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, stat, subprocess, urllib.request, zipfile
          root = pathlib.Path.cwd()
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'source-v131.zip'
          try:
              req = urllib.request.Request(os.environ['SOURCE_URL'], headers={'User-Agent': 'Super-Wiss-Repository-Importer/1.0'})
              with urllib.request.urlopen(req, timeout=120) as src, archive.open('wb') as dst:
                  while chunk := src.read(1024 * 1024):
                      dst.write(chunk)
          except Exception as exc:
              raise SystemExit('Source transfer failed: ' + type(exc).__name__ + ' ' + str(getattr(exc, 'code', ''))) from None
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          expected = '5329bfaa93ef8230dda8576cb95b330157acc141ff2171b8598052503ce64282'
          if digest != expected:
              raise SystemExit('Source archive SHA-256 mismatch')
          records = []
          with zipfile.ZipFile(archive) as z:
              if len(z.infolist()) != 1552:
                  raise SystemExit('Unexpected source archive file count')
              for info in z.infolist():
                  if info.is_dir():
                      continue
                  prefix = 'Super-Wiss-Ascension-1.3.1/'
                  if not info.filename.startswith(prefix):
                      raise SystemExit('Unexpected archive root')
                  name = info.filename[len(prefix):]
                  p = pathlib.PurePosixPath(name)
                  if not name or p.is_absolute() or '..' in p.parts or '.git' in p.parts or '.github' in p.parts or '\\' in name or stat.S_ISLNK(info.external_attr >> 16):
                      raise SystemExit('Unsafe archive path')
                  if p.name in {'.env', 'keystore.properties', 'local.properties', 'credentials.json', 'service-account.json'}:
                      raise SystemExit('Private configuration found: ' + name)
                  if p.suffix.lower() in {'.ttf', '.otf', '.woff', '.woff2', '.pem', '.p12', '.pfx', '.key', '.keystore', '.db', '.sqlite'}:
                      raise SystemExit('Excluded private or font file: ' + name)
                  if p.suffix.lower() == '.jks' and name != 'qa/super-wiss-qa.jks':
                      raise SystemExit('Undocumented signing key: ' + name)
                  data = z.read(info)
                  if p.suffix in {'.js','.mjs','.cjs','.java','.json','.md','.txt','.yml','.yaml','.xml','.gradle','.properties','.sh','.bat','.py'}:
                      text = data.decode('utf-8', errors='replace')
                      if re.search(r'-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{25,}|github_pat_[A-Za-z0-9_]{30,}|AKIA[0-9A-Z]{16}', text):
                          raise SystemExit('Credential format found in ' + name)
                  dest = root / name
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(data)
                  mode = 0o755 if ((info.external_attr >> 16) & 0o111 or name == 'gradlew' or name.endswith('.sh')) else 0o644
                  dest.chmod(mode)
                  records.append({'path': name, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest(), 'executable': mode == 0o755})
          if (root / 'VERSION').read_text().strip() != '1.3.1':
              raise SystemExit('Unexpected project version')
          report = root / 'docs/repository-import'
          report.mkdir(parents=True, exist_ok=True)
          (report / 'SOURCE-INVENTORY.json').write_text(json.dumps({'archive': 'Super-Wiss-1.3.1-Source-Candidate.zip', 'archive_sha256': digest, 'status': 'source-candidate-not-an-android-release', 'files': records}, ensure_ascii=False, indent=2) + '\n')
          (report / 'README.md').write_text('# v1.3.1 repository import\n\nAll 1,552 files from the supplied source candidate are expanded directly into the repository. No bootstrap or split-pack restore is required for this version. Older source packs remain as historical material.\n\nThe ten final weapon PNGs are still pending. No APK or AAB is produced by this import. The public QA keystore is retained only for testing.\n\nSOURCE-INVENTORY.json records every archive member and SHA-256. The accompanying logs are source tests executed during import, not Android device evidence.\n')
          for offset in range(0, len(records), 80):
              subprocess.run(['git', 'add', '-f', '--', *[r['path'] for r in records[offset:offset+80]]], check=True)
          print('Verified and expanded', len(records), 'source files')
          PY
      - name: Set up the existing project Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
      - name: Validate source before committing
        shell: bash
        run: |
          set -euo pipefail
          npm run validate | tee docs/repository-import/assets.txt
          npm test | tee docs/repository-import/core.txt
          npm run test:weapon-ui | tee docs/repository-import/weapon-ui.txt
          npm run validate:maps | tee docs/repository-import/maps.txt
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path.cwd()
          report = json.loads((root/'docs/repository-import/SOURCE-INVENTORY.json').read_text())
          for entry in report['files']:
              if hashlib.sha256((root/entry['path']).read_bytes()).hexdigest() != entry['sha256']:
                  raise SystemExit('Source changed during validation: ' + entry['path'])
          print('Every source file matches the authorized archive after validation')
          PY
      - name: Commit full source without rewriting history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Onyx-66'
          git config user.email '157172129+Onyx-66@users.noreply.github.com'
          git add -- docs/repository-import
          git diff --cached --stat
          git commit -m 'feat(source): import complete Super Wiss Ascension v1.3.1 candidate' -m 'Expand all 1,552 source/archive files as normal paths, including Android Java, JS game, complete existing assets, build scripts, tests, guides and public QA certificate. Preserve older history. Final weapon PNGs and Android compilation remain pending. Source, weapon/UI and map validation passed before this commit.'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main
          echo "Imported source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
