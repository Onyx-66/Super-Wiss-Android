name: Check authorized source transfer
on:
  push:
    branches: [main]
    paths: [.github/workflows/check-source-transfer.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify renewed transfer URL
        env:
          SOURCE_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-014c-8210-8668-c228feab6d63/raw?se=2026-09-27T02%3A57%3A02Z&sp=r&sv=2026-02-06&sr=b&scid=1b2dc702-50dc-5f5d-94d6-866cc88a083b&skoid=a3a8eefe-d4bd-4909-ab1d-2a75a2302fac&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-27T02%3A37%3A09Z&ske=2026-09-28T02%3A37%3A09Z&sks=b&skv=2026-02-06&sig=Q9fNgNwOYaWjJfsu7MI7z9EeQMMOfkJhjTN2fjTS/S0%3D'
        run: |
          python3 - <<'PY'
          import os, urllib.request, urllib.error, re
          try:
              req = urllib.request.Request(os.environ['SOURCE_URL'], headers={'User-Agent': 'Super-Wiss-Repository-Importer/1.0'})
              with urllib.request.urlopen(req, timeout=40) as response:
                  print('HTTP', response.status, 'Type', response.headers.get('Content-Type'), 'Bytes', response.headers.get('Content-Length'))
                  print('ZIP header:', response.read(4) == b'PK\x03\x04')
          except urllib.error.HTTPError as exc:
              print('HTTP', exc.code, exc.reason, 'server=', exc.headers.get('Server'), 'content-type=', exc.headers.get('Content-Type'))
              body = exc.read(800).decode('utf-8', errors='replace')
              body = re.sub(r'https?://\S+|sig=[^\s<]+', '[redacted URL]', body)
              print('Transfer error:', body[:500])
              raise SystemExit(1)
          PY
